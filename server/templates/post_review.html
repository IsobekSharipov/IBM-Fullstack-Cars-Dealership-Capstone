<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Review | Cars Dealership</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand" href="/">Cars Dealership</a><span class="text-white">Welcome, {{ user.username }}</span></nav>
<main class="container py-5" style="max-width:850px">
<a href="/dealers/{{ dealer.id }}/" class="btn btn-outline-secondary mb-4">Back to Dealer</a>
<div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h2">Post Review</h1>
<p class="text-muted">Reviewing {{ dealer.full_name }} — {{ dealer.city }}, {{ dealer.state }}</p>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<div class="mb-3"><label for="name" class="form-label">Your Name</label><input id="name" name="name" class="form-control" required maxlength="120" value="{{ form.name|default:user.get_full_name|default:user.username }}"></div>
<div class="mb-3"><label for="review" class="form-label">Your Review</label><textarea id="review" name="review" class="form-control" rows="5" required maxlength="2000" placeholder="Tell us about your experience">{{ form.review|default:'' }}</textarea></div>
<div class="mb-3"><label for="purchase" class="form-label">Purchase Date (optional)</label><input id="purchase" name="purchase" type="date" class="form-control" value="{{ form.purchase|default:'' }}"></div>
<div class="row">
<div class="col-md-5 mb-3"><label for="car_make" class="form-label">Car Make (optional)</label><input id="car_make" name="car_make" class="form-control" maxlength="80" placeholder="Toyota" value="{{ form.car_make|default:'' }}"></div>
<div class="col-md-5 mb-3"><label for="car_model" class="form-label">Car Model (optional)</label><input id="car_model" name="car_model" class="form-control" maxlength="80" placeholder="Corolla" value="{{ form.car_model|default:'' }}"></div>
<div class="col-md-2 mb-3"><label for="car_year" class="form-label">Year</label><input id="car_year" name="car_year" type="number" min="1900" max="2100" class="form-control" value="{{ form.car_year|default:'' }}"></div>
</div>
<button type="submit" class="btn btn-success">Submit Review</button>
</form></div></div>
</main><script src="/static/js/review-form.js" defer></script>
</body></html>
