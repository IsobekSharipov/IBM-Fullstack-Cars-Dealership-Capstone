<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Cars Dealership</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand" href="/">Cars Dealership</a></nav>
<main class="container mt-5" style="max-width:460px">
<div class="card shadow-sm"><div class="card-body p-4">
<h2 class="mb-4">User Login</h2>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" action="{% url 'user_login_page' %}">
{% csrf_token %}
<label class="form-label" for="username">Username</label>
<input class="form-control mb-3" id="username" name="username" required autocomplete="username">
<label class="form-label" for="password">Password</label>
<input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password">
<button type="submit" class="btn btn-primary w-100">Login</button>
</form>
<a class="d-block mt-3 text-center" href="/">Back to Home</a>
</div></div></main>
</body></html>
